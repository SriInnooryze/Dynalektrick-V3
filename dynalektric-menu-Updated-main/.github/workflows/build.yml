name: Build & Prerender Verification

on:
  push:
    branches: [ main, staging, "feature/*" ]
  pull_request:
    branches: [ main, staging ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Transpile JS
        run: npm run build:js

      - name: Prerender Static Site (Staging)
        run: npm run build:staging
